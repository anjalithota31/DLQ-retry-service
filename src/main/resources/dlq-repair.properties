# ============================================================
# DLQ Repair Service Configuration
# ============================================================
# SECURITY NOTE: Do NOT commit real credentials here.
# All properties can be overridden by environment variables.
# Environment variable naming: Convert property key to uppercase and replace dots with underscores.
# Example: kafka.bootstrap.servers -> KAFKA_BOOTSTRAP_SERVERS
# Example: elasticsearch.url -> ELASTICSEARCH_URL
# Example: elasticsearch.username -> ELASTICSEARCH_USERNAME

# Kafka
# Env var: KAFKA_BOOTSTRAP_SERVERS
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:173.201.37.187:9094}
# Env var: KAFKA_CONSUMER_GROUP_ID
kafka.consumer.group.id=${KAFKA_CONSUMER_GROUP_ID:dlq-repair-service}

# DLQ topic pattern to subscribe to (regex pattern for auto-discovery)
# Matches topics like: dlq_connect_poc.search, dlq_users, DLQ_orders, etc.
# The target index is extracted by removing the dlq_ prefix from the topic name
# Comment this out to use explicit topic instead
# Env var: DLQ_TOPIC_PATTERN
dlq.topic.pattern=(?i)^dlq_.*

# Explicit DLQ topic to subscribe to
# Env var: DLQ_TOPIC
dlq.topic=${DLQ_TOPIC:DLQ_email}

# Elasticsearch
# Use http:// for plain HTTP, https:// for TLS (e.g. Elastic Cloud, secured on-prem)
# Note: URL should be in format scheme://host:port (no trailing slash)
# Env var: ELASTICSEARCH_URL
elasticsearch.url=${ELASTICSEARCH_URL:http://173.201.37.187:30224/}
# Env var: ELASTICSEARCH_USERNAME (or ES_USERNAME for backward compatibility)
elasticsearch.username=${ELASTICSEARCH_USERNAME:elastic}
# Env var: ELASTICSEARCH_PASSWORD (or ES_PASSWORD for backward compatibility)
elasticsearch.password=${ELASTICSEARCH_PASSWORD:ZmlyZWZsaW5rCg==}

# The target business index to reindex repaired documents into
# NOTE: In multi-topic mode, this is extracted from X-Target-Index header (set by sink connector)
# This is only used as fallback if header is missing
# Env var: TARGET_INDEX
target.index=${TARGET_INDEX:connect_poc.search}

# Raw fallback index: stores the full original document with ALL fields as strings.
# Used when a document has unconvertible fields that cannot go into the typed target index.
# Defaults to <target.index>-raw if not set.
# NOTE: In multi-topic mode, this is derived from the target index from headers
# Env var: RAW_FALLBACK_INDEX
raw.fallback.index=${RAW_FALLBACK_INDEX:}

# Index where permanently failed documents are stored for manual review
# Env var: FAILED_DOCS_INDEX
failed.docs.index=${FAILED_DOCS_INDEX:dlq-failed-documents}

# Index where successfully corrected documents (after field removal) are stored for tracking
# Env var: CORRECTED_DOCS_INDEX
corrected.docs.index=${CORRECTED_DOCS_INDEX:dlq-corrected-documents}

# Max number of retry attempts before a document is moved to failed.docs.index
# Env var: MAX_RETRIES
max.retries=${MAX_RETRIES:3}

# Max number of conversion retry attempts for individual fields (array-to-object, etc.)
# Env var: MAX_CONVERSION_RETRIES
max.conversion.retries=${MAX_CONVERSION_RETRIES:3}

# Max number of field removal attempts per document during ES indexing retry
# Env var: MAX_FIELD_REMOVAL_RETRIES
max.field.removal.retries=${MAX_FIELD_REMOVAL_RETRIES:5}

# Kafka connection retry configuration
# Max number of retry attempts for initial Kafka connection
# Env var: KAFKA_CONNECTION_MAX_RETRIES
kafka.connection.max.retries=${KAFKA_CONNECTION_MAX_RETRIES:5}

# Initial Kafka connection retry backoff in milliseconds (exponential backoff applied)
# Env var: KAFKA_CONNECTION_RETRY_BACKOFF_MS
kafka.connection.retry.backoff.ms=${KAFKA_CONNECTION_RETRY_BACKOFF_MS:2000}

# Initial retry backoff in milliseconds (exponential backoff applied)
# Env var: RETRY_BACKOFF_MS
retry.backoff.ms=${RETRY_BACKOFF_MS:50}

# Circuit breaker configuration
# Env var: CIRCUIT_BREAKER_FAILURE_THRESHOLD
circuit.breaker.failure.threshold=${CIRCUIT_BREAKER_FAILURE_THRESHOLD:10}
# Env var: CIRCUIT_BREAKER_TIMEOUT_MS
circuit.breaker.timeout.ms=${CIRCUIT_BREAKER_TIMEOUT_MS:120000}

# Health check server configuration
# Env var: HEALTH_CHECK_PORT
health.check.port=${HEALTH_CHECK_PORT:8080}

# Rate limiting (0 = disabled, otherwise max records per second)
# Env var: RATE_LIMIT_RECORDS_PER_SECOND
rate.limit.records.per.second=${RATE_LIMIT_RECORDS_PER_SECOND:0}

# Max records per Kafka poll - all records in one poll are bulk-indexed in a single ES request
# Env var: CONSUMER_MAX_POLL_RECORDS
consumer.max.poll.records=${CONSUMER_MAX_POLL_RECORDS:1000}

# Max time (ms) between polls before the consumer is considered dead and triggers a rebalance.
# Increase if bulk ES indexing of 500 records takes longer than the default 5 minutes.
# Env var: CONSUMER_MAX_POLL_INTERVAL_MS
consumer.max.poll.interval.ms=${CONSUMER_MAX_POLL_INTERVAL_MS:600000}

# Session timeout (ms) - critical for partition assignment
# The consumer is considered dead if no heartbeat is received within this time
# Env var: CONSUMER_SESSION_TIMEOUT_MS
consumer.session.timeout.ms=${CONSUMER_SESSION_TIMEOUT_MS:30000}

# Heartbeat interval (ms) - must be less than session timeout
# Frequency of heartbeats sent to the consumer group coordinator
# Env var: CONSUMER_HEARTBEAT_INTERVAL_MS
consumer.heartbeat.interval.ms=${CONSUMER_HEARTBEAT_INTERVAL_MS:10000}

# Metadata fetch timeout (ms) - time to wait for topic metadata from broker
# Increase if broker is slow to respond or network has high latency
# Env var: CONSUMER_METADATA_TIMEOUT_MS
consumer.metadata.timeout.ms=${CONSUMER_METADATA_TIMEOUT_MS:30000}

# Request timeout (ms) - timeout for all Kafka client requests
# Env var: CONSUMER_REQUEST_TIMEOUT_MS
consumer.request.timeout.ms=${CONSUMER_REQUEST_TIMEOUT_MS:40000}

# Rebalance timeout (ms) - time allowed for group rebalance
# Env var: CONSUMER_REBALANCE_TIMEOUT_MS
consumer.rebalance.timeout.ms=${CONSUMER_REBALANCE_TIMEOUT_MS:60000}

# Fetch min bytes - minimum bytes to wait for in a fetch request
# Env var: CONSUMER_FETCH_MIN_BYTES
consumer.fetch.min.bytes=${CONSUMER_FETCH_MIN_BYTES:1}

# Fetch max wait (ms) - max time to wait for fetch.min.bytes
# Env var: CONSUMER_FETCH_MAX_WAIT_MS
consumer.fetch.max.wait.ms=${CONSUMER_FETCH_MAX_WAIT_MS:500}

# How often (ms) to reload the ES index mapping to pick up schema changes without restart
# Env var: MAPPING_REFRESH_INTERVAL_MS
mapping.refresh.interval.ms=${MAPPING_REFRESH_INTERVAL_MS:300000}

# Mapping cache configuration for multi-index support
# Env var: MAPPING_CACHE_SIZE
mapping.cache.size=${MAPPING_CACHE_SIZE:200}
# Env var: MAPPING_CACHE_TTL_MINUTES
mapping.cache.ttl.minutes=${MAPPING_CACHE_TTL_MINUTES:10}

# Thread pool configuration for concurrent processing
# Env var: THREAD_POOL_SIZE
thread.pool.size=${THREAD_POOL_SIZE:50}
# Env var: THREAD_POOL_QUEUE_SIZE
thread.pool.queue.size=${THREAD_POOL_QUEUE_SIZE:5000}
